<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none" role="img" aria-labelledby="coverageDiagramTitle coverageDiagramDesc">
  <title id="coverageDiagramTitle">Three-point suburb coverage alignment check for Perth cleaning businesses</title>
  <desc id="coverageDiagramDesc">Diagram illustrating how Google Business Profile service areas, website suburb statements, and quote form prompts should align with actual travel boundaries.</desc>
  <rect width="800" height="260" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <rect x="28" y="32" width="232" height="196" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="44" y="62" fill="#0369A1" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">TOUCHPOINT 01</text>
  <text x="44" y="88" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">Google Business Profile</text>
  <text x="44" y="114" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">Check listed suburbs or postcodes</text>
  <text x="44" y="134" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">in the Service Area settings</text>
  <text x="44" y="154" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">(maximum 20 areas in GBP).</text>
  <text x="44" y="196" fill="#0F172A" font-family="JetBrains Mono, monospace" font-size="11">Publisher: Business owner</text>

  <rect x="284" y="32" width="232" height="196" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="300" y="62" fill="#0369A1" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">TOUCHPOINT 02</text>
  <text x="300" y="88" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">Website Service Pages</text>
  <text x="300" y="114" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">Check homepage intro, footer</text>
  <text x="300" y="134" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">suburb lists, and FAQ notes on</text>
  <text x="300" y="154" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">minimum booking rules.</text>
  <text x="300" y="196" fill="#0F172A" font-family="JetBrains Mono, monospace" font-size="11">Publisher: Owner or web contact</text>

  <rect x="540" y="32" width="232" height="196" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="556" y="62" fill="#0369A1" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">TOUCHPOINT 03</text>
  <text x="556" y="88" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">Enquiry &amp; Quote Prompts</text>
  <text x="556" y="114" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">Ask for suburb, clean type, and</text>
  <text x="556" y="134" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">home size up front so out-of-area</text>
  <text x="556" y="154" fill="#334155" font-family="Public Sans, sans-serif" font-size="12.5">leads are spotted early.</text>
  <text x="556" y="196" fill="#0F172A" font-family="JetBrains Mono, monospace" font-size="11">Publisher: Owner or web contact</text>
</svg>
